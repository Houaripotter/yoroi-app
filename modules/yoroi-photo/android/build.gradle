// Module local YOROI (modules/yoroi-photo) : relie tout seul par l'autolinking d'Expo (expoAutolinking.useExpoModules()
// dans android/settings.gradle). Rien a ajouter dans android/app/build.gradle.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.yoroiphoto'
version = '1.0.0'

android {
  namespace "expo.modules.yoroiphoto"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // ML Kit, modeles DANS l'app (pas la version Google Play services) : marche hors ligne des l'installation,
  // aucun telechargement de modele, rien sur un telephone sans Google. Versions figees.
  // Visage, environ 6,9 Mo : https://developers.google.com/ml-kit/vision/face-detection/android
  implementation 'com.google.mlkit:face-detection:16.1.7'
  // Detourage Selfie Segmentation (beta), environ 4,5 Mo : https://developers.google.com/ml-kit/vision/selfie-segmentation/android
  implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
  // Sens de la photo (EXIF)
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
